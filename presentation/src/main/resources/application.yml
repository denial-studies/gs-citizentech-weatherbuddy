spring:
  application:
    name: weatherbuddy

  datasource:
    url: ${ORACLE_URL:jdbc:oracle:thin:@oracle.fiap.com.br:1521:ORCL}
    username: ${ORACLE_USER:rm000000}
    password: ${ORACLE_PASS:senha}
    driver-class-name: oracle.jdbc.OracleDriver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  thymeleaf:
    cache: false

server:
  port: ${PORT:8080}

# Habilita dados mockados (true, on ou 1)
db-env: ${DB_ENV:true}
