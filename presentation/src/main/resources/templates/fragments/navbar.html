<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<body>

<header th:fragment="navbar" class="navbar">
    <div class="navbar-container">
        <a th:href="@{/}" class="navbar-brand">
            <span class="brand-wave-box" aria-hidden="true">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M2 7c2-2 4-2 6 0s4 2 6 0 4-2 6 0"/>
                    <path d="M2 12c2-2 4-2 6 0s4 2 6 0 4-2 6 0"/>
                    <path d="M2 17c2-2 4-2 6 0s4 2 6 0 4-2 6 0"/>
                </svg>
            </span>
            <span>Weather Buddy</span>
        </a>

        <nav class="navbar-actions">
            <!-- VISÃO DA ÁREA RESTRITA (LOGADO): exibe API Swagger, Sino e Botão de Logoff (Sair) -->
            <div th:if="${abaAtiva != null}" style="display: flex; align-items: center; gap: 0.55rem; flex-wrap: wrap;">
                <a th:href="@{/swagger-ui.html}" target="_blank" class="btn btn-sm btn-outline-light">
                    API Swagger
                </a>
                <a th:href="@{/dashboard/envios}" class="bell-btn" title="Central de Alertas e Envios">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
                        <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
                    </svg>
                    <span class="bell-dot"></span>
                </a>
                <form th:action="@{/logout}" method="post" style="margin: 0;">
                    <button type="submit" class="btn btn-sm btn-danger-outline" style="font-weight: 800;">
                        Sair (Logoff)
                    </button>
                </form>
            </div>

            <!-- VISÃO PÚBLICA (NÃO LOGADO): exibe apenas o botão Área Restrita -->
            <div th:if="${abaAtiva == null}" style="display: flex; align-items: center; gap: 0.55rem;">
                <a th:href="@{/login}" class="btn btn-sm btn-primary">
                    Área Restrita
                </a>
            </div>
        </nav>
    </div>

    <!-- Bottom Navigation Bar: exibida APENAS dentro da Área Restrita (quando logado) -->
    <div th:if="${abaAtiva != null}" class="m3-bottom-nav">
        <div class="m3-bottom-nav-inner">
            <a th:href="@{/dashboard}" class="m3-nav-item" th:classappend="${abaAtiva == 'monitoramento' ? 'active' : ''}">
                <span class="m3-nav-icon-pill">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M20 16.2A4.5 4.5 0 0 0 17.5 8h-1.8A7 7 0 1 0 4 14.9"/>
                        <path d="M16 14v6"/><path d="M8 14v6"/><path d="M12 16v6"/>
                    </svg>
                </span>
                <span>Monitorar</span>
            </a>
            <a th:href="@{/dashboard/numeros}" class="m3-nav-item" th:classappend="${abaAtiva == 'numeros' ? 'active' : ''}">
                <span class="m3-nav-icon-pill">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/>
                    </svg>
                </span>
                <span>Números</span>
            </a>
            <a th:href="@{/dashboard/contas}" class="m3-nav-item" th:classappend="${abaAtiva == 'contas' ? 'active' : ''}">
                <span class="m3-nav-icon-pill">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
                        <circle cx="9" cy="7" r="4"/>
                    </svg>
                </span>
                <span>Contas</span>
            </a>
            <a th:href="@{/dashboard/envios}" class="m3-nav-item" th:classappend="${abaAtiva == 'envios' ? 'active' : ''}">
                <span class="m3-nav-icon-pill">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="22" y1="2" x2="11" y2="13"/>
                        <polygon points="22 2 15 22 11 13 2 9 22 2"/>
                    </svg>
                </span>
                <span>Envios</span>
            </a>
            <form th:action="@{/logout}" method="post" style="margin: 0;">
                <button type="submit" class="m3-nav-item" style="background: none; border: none; cursor: pointer; color: #B91C1C; font-family: inherit;">
                    <span class="m3-nav-icon-pill" style="background-color: #FEF2F2; color: #B91C1C;">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
                            <polyline points="16 17 21 12 16 7"/>
                            <line x1="21" y1="12" x2="9" y2="12"/>
                        </svg>
                    </span>
                    <span>Logoff</span>
                </button>
            </form>
        </div>
    </div>
</header>

<nav th:fragment="painelMenu" style="display: flex; justify-content: space-between; align-items: center; gap: 0.5rem; flex-wrap: wrap; margin-bottom: 1.25rem; padding: 0.55rem 0.75rem; background: #FFFFFF; border: 1px solid #E2E8F0; border-radius: 999px; box-shadow: 0 4px 14px rgba(10, 69, 149, 0.05);">
    <div style="display: flex; gap: 0.45rem; flex-wrap: wrap;">
        <a th:href="@{/dashboard}"
           class="btn btn-sm"
           th:style="${abaAtiva == 'monitoramento' ? 'background-color: #0B57D0; color: #FFFFFF;' : 'background-color: transparent; color: #334155;'}">
            1. Monitoramento &amp; Regiões
        </a>
        <a th:href="@{/dashboard/numeros}"
           class="btn btn-sm"
           th:style="${abaAtiva == 'numeros' ? 'background-color: #0B57D0; color: #FFFFFF;' : 'background-color: transparent; color: #334155;'}">
            2. Números Cadastrados
        </a>
        <a th:href="@{/dashboard/contas}"
           class="btn btn-sm"
           th:style="${abaAtiva == 'contas' ? 'background-color: #0B57D0; color: #FFFFFF;' : 'background-color: transparent; color: #334155;'}">
            3. Contas do Sistema
        </a>
        <a th:href="@{/dashboard/envios}"
           class="btn btn-sm"
           th:style="${abaAtiva == 'envios' ? 'background-color: #0B57D0; color: #FFFFFF;' : 'background-color: #FCEEEE; color: #8C1D18;'}">
            4. WhatsApp &amp; Envios
        </a>
    </div>
    <div style="display: flex; gap: 0.45rem; align-items: center; flex-wrap: wrap;">
        <a th:href="@{/swagger-ui.html}" target="_blank" class="btn btn-sm btn-outline-light">
            API Swagger &nearr;
        </a>
        <form th:action="@{/logout}" method="post" style="margin: 0;">
            <button type="submit" class="btn btn-sm btn-danger-outline">
                Sair (Logoff)
            </button>
        </form>
    </div>
</nav>

</body>
</html>
